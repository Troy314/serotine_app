# ============================================================
#  Serotine App — hub de l'équipe Sérotine (Tableau de Bohr, Plan de com…)
#  (voir _architecture/serotine_app.md dans topinambours)
#
#  cp .env.example .env   # puis renseigner les valeurs
#  docker compose up -d --build
# ============================================================

services:

  serotine_app:
    build: .
    image: serotine_app:latest
    container_name: serotine_app
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3101
      BEHIND_HTTPS_PROXY: "1"
      COREDB_URL: http://postgrest:3000   # PostgREST de core_db (jamais de SQL direct)
      COREDB_JWT_SECRET: ${COREDB_JWT_SECRET:?JWT_SECRET de core_db, à renseigner dans .env}
      DATABASE_URL: postgres://serotine:${PRIVATE_DB_PASSWORD:?à renseigner dans .env}@serotine_db:5432/serotine
    volumes:
      # Sauvegardes pg_dump et tableurs d'import : restent sur l'hôte, jamais dans l'image ni dans git.
      - ./data:/app/data
    ports:
      # Lié à l'IP LAN de l'hôte : cible du tunnel Cloudflare, comme AurAgenda/FormAlpes/AurOpenBadges.
      # Hôte public à créer côté Cloudflare (tableau de bord Zero Trust, token géré à distance —
      # pas de config.yml local ici) : "Public Hostname" → http://192.168.1.26:8093.
      - "192.168.1.26:8093:3101"
    depends_on:
      serotine_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/auth/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - serotine_app_net
      - proxy_net
      - core_db_net   # PostgREST (http://postgrest:3000), voir core_db/README.md

  # Base PRIVÉE de Serotine App (Tableau de Bohr, Plan de com, réglages, sessions).
  # Seulement sur serotine_app_net : aucun autre outil ne peut l'atteindre (skill §6).
  # Le nom du service n'est PAS « db » : l'app est aussi sur core_db_net, où le conteneur de core_db répond déjà à « db » —
  # avec ce nom, l'app tombait sur la mauvaise base (« password authentication failed », vu à l'essai du 2026-10-09).
  serotine_db:
    image: postgres:16-alpine
    container_name: serotine_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: serotine
      POSTGRES_DB: serotine
      POSTGRES_PASSWORD: ${PRIVATE_DB_PASSWORD:?à renseigner dans .env}
    volumes:
      - serotine_app_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serotine -d serotine"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - serotine_app_net

volumes:
  serotine_app_pgdata:

networks:
  serotine_app_net:
    name: serotine_app_net
    driver: bridge
  proxy_net:
    external: true
  core_db_net:
    external: true
